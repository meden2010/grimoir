name: Grimoir CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Lint, Test & Build (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck / Lint
        run: bun run lint

      - name: Fast Static Node Compatibility Audit
        run: bun run audit:compat

      - name: Run Unit Tests
        run: bun test

      - name: Build Distribution (dist/)
        run: bun run build

      - name: Generate Demo Fixtures
        run: bun scripts/generate-demo-data.ts

      - name: Archive build and fixtures
        uses: actions/upload-artifact@v4
        with:
          name: grimoir-dist
          path: |
            dist/
            tests/fixtures/
            package.json
          retention-days: 1

  node-compatibility-matrix:
    name: Real Node.js Execution (${{ matrix.node-version }})
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository (for package files)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: grimoir-dist

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install production dependencies via npm
        run: npm install --omit=dev

      - name: Verify CLI execution under Node ${{ matrix.node-version }}
        run: |
          node dist/cli/index.js generate --input tests/fixtures/demo-output --output ./output --no-serve
          test -f ./output/index.html
          node dist/cli/index.js clean --output ./output
          test ! -f ./output/.grimoir-history.json
